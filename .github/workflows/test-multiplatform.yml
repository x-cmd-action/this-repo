name: test-multiplatform
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily at 06:00 UTC — cheap catch for regressions before users hit them.
    - cron: "0 6 * * *"

# Default permissions: read-only. The auto-issue step bumps to write.
permissions:
  contents: read

jobs:
  test-ubuntu:
    name: "ubuntu-latest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bench start (cold)
        run: date +%s%N > /tmp/bench_start

      - name: clone via this-repo (cold)
        uses: x-cmd-action/this-repo@v1

      - name: bench end (cold)
        run: date +%s%N > /tmp/bench_end

      - name: verify + report
        shell: bash
        run: |
          # ── functional checks (mirror existing test.yml) ──
          test -d "$GITHUB_WORKSPACE/.git" || { echo "FAIL: not a git repo"; exit 1; }
          test -f "$GITHUB_WORKSPACE/action.yml" || { echo "FAIL: action.yml missing"; exit 1; }
          test "$(git -C "$GITHUB_WORKSPACE" config user.name)" = "github-actions[bot]" \
              || { echo "FAIL: bot user.name not set"; exit 1; }
          test "$(git -C "$GITHUB_WORKSPACE" config user.email)" = "github-actions[bot]@users.noreply.github.com" \
              || { echo "FAIL: bot user.email not set"; exit 1; }
          URL=$(git -C "$GITHUB_WORKSPACE" config remote.origin.url)
          echo "$URL" | grep -qv "x-access-token" || { echo "FAIL: token in URL"; exit 1; }

          # ── metrics ──
          COLD_NS=$(awk 'BEGIN {getline s < "/tmp/bench_start"; getline e < "/tmp/bench_end"; printf "%.0f", (e-s)/1000000}')
          CLONE_BYTES=$(du -sb "$GITHUB_WORKSPACE" | awk '{print $1}')
          TARBALL_BYTES=$(du -sb "$HOME/.cache/actions/x-cmd-action/this-repo" 2>/dev/null \
                            || find /home/runner/work/_actions/x-cmd-action/this-repo -type f -exec wc -c {} + 2>/dev/null | tail -1 | awk '{print $1}')
          BASH_VERSION_STR=$(bash --version | head -1)

          {
            echo "## ubuntu-latest"
            echo ""
            echo "| metric | value |"
            echo "|---|---|"
            echo "| result | PASS |"
            echo "| step wall-clock (cold) | ${COLD_NS} ms |"
            echo "| cloned repo size | ${CLONE_BYTES} bytes |"
            echo "| bash version | ${BASH_VERSION_STR} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "RESULT=PASS BASH=$BASH_VERSION_STR STEP_MS=$COLD_NS CLONE_BYTES=$CLONE_BYTES TARBALL_BYTES=$TARBALL_BYTES" >> "$GITHUB_OUTPUT"

  test-windows:
    name: "windows-latest"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Windows runners default to pwsh. For bash-only constructs we have
      # to be explicit. The action itself runs `bash lib/this-repo.sh`,
      # which finds bash on PATH on windows-latest runners (Git Bash).
      - name: show bash availability
        shell: bash
        run: |
          echo "bash on PATH: $(command -v bash)"
          bash --version
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "HOME=$HOME"

      - name: bench start (cold)
        shell: bash
        run: date +%s%N > /tmp/bench_start

      - name: clone via this-repo (cold)
        uses: x-cmd-action/this-repo@v1

      - name: bench end (cold)
        shell: bash
        run: date +%s%N > /tmp/bench_end

      - name: verify + report (bash)
        shell: bash
        run: |
          # On Windows runners, $GITHUB_WORKSPACE is a Windows-style path
          # (e.g., D:/a/this-repo/this-repo). The action writes via
          # POSIX-style paths inside bash; verify with a quick
          # `cd && pwd` to make sure it landed somewhere sensible.
          cd "$GITHUB_WORKSPACE" || { echo "FAIL: cannot cd to workspace"; exit 1; }
          test -d .git || { echo "FAIL: not a git repo"; exit 1; }
          test -f action.yml || { echo "FAIL: action.yml missing"; exit 1; }
          test "$(git config user.name)" = "github-actions[bot]" \
              || { echo "FAIL: bot user.name not set"; exit 1; }
          URL=$(git config remote.origin.url)
          echo "$URL" | grep -qv "x-access-token" || { echo "FAIL: token in URL"; exit 1; }

          COLD_NS=$(awk 'BEGIN {getline s < "/tmp/bench_start"; getline e < "/tmp/bench_end"; printf "%.0f", (e-s)/1000000}')
          CLONE_BYTES=$(du -sb "$GITHUB_WORKSPACE" | awk '{print $1}')
          BASH_VERSION_STR=$(bash --version 2>&1 | head -1 || echo "bash unavailable")

          {
            echo "## windows-latest"
            echo ""
            echo "| metric | value |"
            echo "|---|---|"
            echo "| result | PASS |"
            echo "| step wall-clock (cold) | ${COLD_NS} ms |"
            echo "| cloned repo size | ${CLONE_BYTES} bytes |"
            echo "| bash version | ${BASH_VERSION_STR} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "RESULT=PASS BASH=$BASH_VERSION_STR STEP_MS=$COLD_NS CLONE_BYTES=$CLONE_BYTES" >> "$GITHUB_OUTPUT"

  test-macos:
    name: "macos-latest"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: show bash version (macos ships bash 3.2)
        shell: bash
        run: |
          echo "bash version: $(bash --version | head -1)"
          # Verify we're not relying on bash 4+ features
          if [ "${BASH_VERSINFO[0]}" -lt 4 ]; then
            echo "WARNING: bash < 4 — verifying portability"
          fi

      - name: bench start (cold)
        shell: bash
        run: date +%s%N > /tmp/bench_start

      - name: clone via this-repo (cold)
        uses: x-cmd-action/this-repo@v1

      - name: bench end (cold)
        shell: bash
        run: date +%s%N > /tmp/bench_end

      - name: verify + report
        shell: bash
        run: |
          test -d "$GITHUB_WORKSPACE/.git" || { echo "FAIL: not a git repo"; exit 1; }
          test -f "$GITHUB_WORKSPACE/action.yml" || { echo "FAIL: action.yml missing"; exit 1; }
          test "$(git -C "$GITHUB_WORKSPACE" config user.name)" = "github-actions[bot]" \
              || { echo "FAIL: bot user.name not set"; exit 1; }
          URL=$(git -C "$GITHUB_WORKSPACE" config remote.origin.url)
          echo "$URL" | grep -qv "x-access-token" || { echo "FAIL: token in URL"; exit 1; }

          COLD_NS=$(awk 'BEGIN {getline s < "/tmp/bench_start"; getline e < "/tmp/bench_end"; printf "%.0f", (e-s)/1000000}')
          CLONE_BYTES=$(du -sb "$GITHUB_WORKSPACE" | awk '{print $1}')
          BASH_VERSION_STR=$(bash --version | head -1)

          {
            echo "## macos-latest"
            echo ""
            echo "| metric | value |"
            echo "|---|---|"
            echo "| result | PASS |"
            echo "| step wall-clock (cold) | ${COLD_NS} ms |"
            echo "| cloned repo size | ${CLONE_BYTES} bytes |"
            echo "| bash version | ${BASH_VERSION_STR} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "RESULT=PASS BASH=$BASH_VERSION_STR STEP_MS=$COLD_NS CLONE_BYTES=$CLONE_BYTES" >> "$GITHUB_OUTPUT"

  # ─── Aggregate + auto-issue ───
  report:
    name: "report + auto-issue"
    needs: [test-ubuntu, test-windows, test-macos]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: decide pass/fail
        id: decide
        run: |
          UB="${{ needs.test-ubuntu.result }}"
          WI="${{ needs.test-windows.result }}"
          MA="${{ needs.test-macos.result }}"
          echo "ubuntu=$UB windows=$WI macos=$MA"
          if [ "$UB" = "success" ] && [ "$WI" = "success" ] && [ "$MA" = "success" ]; then
            echo "all_pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "all_pass=false" >> "$GITHUB_OUTPUT"
            echo "failed_platforms=" >> "$GITHUB_OUTPUT"
            [ "$UB" != "success" ] && echo "failed_platforms+=ubuntu," >> "$GITHUB_OUTPUT"
            [ "$WI" != "success" ] && echo "failed_platforms+=windows," >> "$GITHUB_OUTPUT"
            [ "$MA" != "success" ] && echo "failed_platforms+=macos," >> "$GITHUB_OUTPUT"
          fi

      - name: close resolved multi-platform issues
        if: steps.decide.outputs.all_pass == 'true'
        uses: peter-evans/close-issue@v3
        with:
          comment: |
            Multi-platform test passed on all platforms.

            - ubuntu: success
            - windows: success
            - macos: success

            Auto-closing this issue.
          issue-pattern: "Multi-platform test"
          labels: "multi-platform"
          states: open
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: open / comment issue on failure
        if: steps.decide.outputs.all_pass == 'false'
        uses: peter-evans/create-or-update-issue@v4
        with:
          title: "Multi-platform test failed"
          body: |
            Multi-platform CI run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) failed.

            | platform | result |
            |---|---|
            | ubuntu-latest | ${{ needs.test-ubuntu.result }} |
            | windows-latest | ${{ needs.test-windows.result }} |
            | macos-latest | ${{ needs.test-macos.result }} |

            Triggered by: ${{ github.event_name }} (${{ github.ref }}).
          labels: "multi-platform"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
