name: this-repo
description: |
  Minimal pure-shell checkout: clones the current GitHub repo to
  ~/.x-repo/<host>/<owner>/<repo> using the runner's token, sets the
  default bot identity, and (optionally) applies a repo-scoped
  .gitconfig via [include].

  The repo lives at ~/.x-repo/<host>/<owner>/<repo> — the x-cmd local
  cache layout (matches ~/.x-repo/<provider>/<owner>/<repo>). So x-cmd
  tools like `x repo` and `x gitb backup` find the repo automatically.

  After cloning, this action exposes the repo at $GITHUB_WORKSPACE:
  if the workspace is empty, it is REPLACED with a symlink to the
  repo so subsequent `run:` steps run in the repo root by default
  (same ergonomics as actions/checkout). If the workspace already has
  files, a `.this-repo` symlink is created inside it instead — use
  `working-directory: ${{ github.workspace }}/.this-repo` to run
  commands in the repo.

  No SSH, no fetch-additional, no filter/sparse — just the minimum
  needed to land the current repo on disk for downstream steps.

inputs:
  ref:
    description: 'Branch, tag, or SHA to check out (default: trigger ref)'
    required: false
    default: ${{ github.ref_name }}
  depth:
    description: 'Commits to fetch; 0 = full history. Default 0 — this-repo is for landing the current repo locally for downstream x-cmd tools; full history is the expected use case.'
    required: false
    default: '0'
  lfs:
    description: 'Pull LFS files after checkout'
    required: false
    default: 'false'
  submodules:
    description: 'Submodule recursion: false | true | recursive'
    required: false
    default: 'false'
  github-server-url:
    description: 'GitHub server URL (override for Enterprise Server)'
    required: false
    default: ${{ github.server_url }}
  gitconfig:
    description: |
      Path to a .gitconfig file. When set, added as [include] in the
      cloned repo's .git/config — repo-scoped only, the runner's
      ~/.gitconfig is left alone. Use for repo-specific signing keys,
      custom identity, hooks, etc.
    required: false

runs:
  using: composite
  steps:
    - name: clone current repo into ~/.x-repo (shell)
      shell: bash
      env:
        INPUT_REF: ${{ inputs.ref }}
        INPUT_DEPTH: ${{ inputs.depth }}
        INPUT_LFS: ${{ inputs.lfs }}
        INPUT_SUBMODULES: ${{ inputs.submodules }}
        INPUT_GITHUB_SERVER_URL: ${{ inputs.github-server-url }}
        INPUT_GITCONFIG: ${{ inputs.gitconfig }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_TOKEN: ${{ github.token }}
      run: bash ${{ github.action_path }}/lib/this-repo.sh
