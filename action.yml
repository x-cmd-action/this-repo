name: this-repo
description: |
  Minimal pure-shell checkout: clones the current GitHub repo into
  $GITHUB_WORKSPACE using the runner's token, sets the default bot
  identity, and (optionally) applies a repo-scoped .gitconfig via
  [include].

  This is x-cmd-action/checkout stripped down to the minimum useful
  set of inputs. Use this when you don't need SSH, sparse-checkout,
  filter, fetch-additional, etc. Use x-cmd-action/checkout if you
  need any of those.

inputs:
  ref:
    description: 'Branch, tag, or SHA to check out (default: trigger ref)'
    required: false
    default: ${{ github.ref_name }}
  depth:
    description: 'Commits to fetch; 0 = full history. Default 0 — this-repo is for landing the current repo locally for downstream x-cmd tools; full history is the expected use case.'
    required: false
    default: '0'
  lfs:
    description: 'Pull LFS files after checkout'
    required: false
    default: 'false'
  submodules:
    description: 'Submodule recursion: false | true | recursive'
    required: false
    default: 'false'
  github-server-url:
    description: 'GitHub server URL (override for Enterprise Server)'
    required: false
    default: ${{ github.server_url }}
  gitconfig:
    description: |
      Path to a .gitconfig file. When set, added as [include] in the
      cloned repo's .git/config — repo-scoped only, the runner's
      ~/.gitconfig is left alone. Use for repo-specific signing keys,
      custom identity, hooks, etc.
    required: false

runs:
  using: composite
  steps:
    - name: clone current repo into $GITHUB_WORKSPACE (shell)
      shell: bash
      env:
        INPUT_REF: ${{ inputs.ref }}
        INPUT_DEPTH: ${{ inputs.depth }}
        INPUT_LFS: ${{ inputs.lfs }}
        INPUT_SUBMODULES: ${{ inputs.submodules }}
        INPUT_GITHUB_SERVER_URL: ${{ inputs.github-server-url }}
        INPUT_GITCONFIG: ${{ inputs.gitconfig }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}
      run: |
        # Convert action_path to POSIX form on Windows (cygpath is available in Git Bash).
        # On Linux/macOS, cygpath doesn't exist; cygpath -u is a no-op fallback to the input.
        if command -v cygpath >/dev/null 2>&1; then
          ACTION_PATH=$(cygpath -u "$GITHUB_ACTION_PATH")
        else
          ACTION_PATH="$GITHUB_ACTION_PATH"
        fi
        bash "$ACTION_PATH/lib/this-repo.sh"
